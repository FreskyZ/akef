种田和养殖:
  灰芦麦: 下称小麦
  苦叶椒: 下称辣椒
  金石稻: 下称稻米
  平薯: 下称土豆，另产土豆叶
  茄果: 下称番茄
  青菜: 还有优质青菜
  脆蔗: 下称甘蔗
  球豆: 下称毛豆，另产毛豆壳
  多味菇: 下称蘑菇，还有优质蘑菇
  青叶莓: 下称草莓，还有优质草莓
  白瓜: 下称冬瓜
  籽油花: 下称油菜花
  肉块: 下称肉，还有优质肉 # 竟然是源石虫肉
  兽奶: 下称牛奶，还有优质牛奶
  禽蛋: 下称鸡蛋，还有优质鸡蛋
  鳞肉: 下称鱼肉，还有优质鱼肉

# 这些东西不需要自动化，所以配方时间不重要
食材:
  面粉: 小麦 => 3面粉，粉碎机
  辣椒粉: 辣椒 => 3辣椒粉，粉碎机
  淀粉: 土豆 => 3淀粉，粉碎机
  砂糖: 甘蔗 => 3砂糖，粉碎机 # 甘蔗粉碎生产砂糖说是
  菜籽油: 油菜花 + 水 => 菜籽油，扩容/反应池
  饱食饲料: 土豆叶 => 3土豆叶粉末，粉碎机，土豆叶粉末 + 水 => 饱食饲料，扩容/反应池
  双效饱食饲料: 毛豆壳 => 3毛豆壳粉末，粉碎机，毛豆壳粉末 + 水 => 双效饱食饲料，扩容/反应池
  一百三十香: 没有配方

