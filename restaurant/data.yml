经营主题:
  # TODO 基础要求的雅致，茶香赏钱加成等是否适用于主题经营
  基础要求: 菜品x6，菜品类型x3，饮品x3
  糖盐相配: 甜品x1，菜肴x1，赏钱加成：菜肴，甜品
  # 不是没有肉就是素食
  养身心: 素食或滋补x2，赏钱加成：素食，滋补，fever要求降低，符合赏钱加成的概率提升
  # 不是有肉就是肉食，有鱼就是水产
  海陆宴: 肉食x1，水产x1，赏钱加成：肉食，水产，暴击赏钱加成提升
  # 不是有鱼肉就鲜，不是鲜就有鱼肉
  群鱼会: 原料鱼肉或优质鱼肉x3，赏钱加成：鲜，fever加成提升
  # 目前只有饮料有茶香果香
  暇时茶点: 汤羹x2，甜品x2，赏钱加成：汤羹，甜品，茶香，果香，老饕的数量增加，汤羹和甜品的概率提升，饮品的概率提升
  一汤一饭: 主食x2，汤羹x2，赏钱加成：主食，汤羹，用餐时间缩短，主食和汤羹的概率提升
  # 目前还没解锁雅致
  八方美馔: 雅致或美观x2，赏钱加成：雅致，美观，雅致和美观的概率提升，雅致和美观的赏钱加成提升
  五味俱全: 酸x1，甜x1，咸x1，鲜x1，辣x1，赏钱加成：酸，甜，咸，鲜，辣，酸甜咸鲜辣的概率提升，赏钱加成提升
  五谷盈门: 主食x2，赏钱加成：主食
  席间小酌: 饮品x2，赏钱加成：菜肴，饮品
  # 千万别选酸辣汤
