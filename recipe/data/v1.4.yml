# v1.4 2026-07-16 灼铜科技
# v1.3 2026-06-05 是危机合约版本没有基建更新如果你在找的话

配方:
  # 环境里的惰气和息壤气都是采集的，只有酸气是生产的
  沉积酸气化: 沉积酸 =>[液气转化机]=> 酸气
  沉积酸液化: 酸气 =>[液气转化机]=> 沉积酸
  # 和一堆新的相变
  息壤气化: 液化息壤 =>[液气转化机]=> 息壤气
  息壤液化: 息壤气 =>[液气转化机]=> 液化息壤
  息壤升华: 息壤 =>[固气转化机]=> 息壤气
  息壤凝华: 息壤气 =>[固气转化机]=> 息壤
  重息壤气化: 2液化重息壤 =>[液气转化机]=> 5重息壤气
  重息壤液化: 5重息壤气 =>[液气转化机]=> 2液化重息壤
  重息壤升华: 2重息壤 =>[固气转化机]=> 5重息壤气
  重息壤凝华: 5重息壤气 =>[固气转化机]=> 2重息壤
  赤铜气化: 2赤铜溶液 =>[液气转化机]=> 气态赤铜
  赤铜液化: 气态赤铜 =>[液气转化机]=> 2赤铜溶液
  赤铜升华: 2赤铜块 =>[固气转化机]=> 气态赤铜
  赤铜凝华: 气态赤铜 =>[固气转化机]=> 2赤铜块
  赫铜气化: 赫铜溶液 =>[液气转化机]=> 气态赫铜
  赫铜液化: 气态赫铜 =>[液气转化机]=> 赫铜溶液
  赫铜升华: 赫铜块 =>[固气转化机]=> 2气态赫铜
  赫铜凝华: 2气态赫铜 =>[固气转化机]=> 赫铜块
  # 妙妙提纯小道具
  赤铜耐压罐生产: 2赤铜块 + 惰气 =>[塑形机]=> 赤铜耐压罐
  分离芯生产: 赤铜耐压罐 + 息壤 =>[封装机]=> 2分离芯
  # 快进版赤铜=>赫铜，如果你忘了的话之前的比例是4：1
  # 2赤铜块 = 2赤铜溶液 = 1赤铜气，1赫铜块 = 2赫铜溶液 = 2赫铜气
  # 旧配方4赤铜溶液 = 1赫铜溶液，新配方2赤铜气 = 2赫铜气，两个公式之间从4：1变成了2：1，不是简单看看的4：1变成1：1
  赫铜气体提纯: 2气态赤铜 + 2分离芯 =>[提纯机]=> 2气态赫铜
  赫铜气体提纯-稳定环境: 2气态赤铜 + 分离芯 =>[提纯机+惰气环境]=> 2气态赫铜
  # 快进版灰=>息壤，如果你忘了的话以前要用砂叶大人磨成致密
  息壤生产-惰气环境: 碳块 + 清水 =>[天有洪炉+惰气环境]=> 息壤
  # 快进版息壤=>重息壤，如果你忘了的话以前要用污水生产重息壤
  重息壤气体提纯: 2息壤气 + 2分离芯 =>[提纯机]=> 重息壤气
  重息壤气体提纯-稳定环境: 2息壤气 + 分离芯 =>[提纯机+惰气环境]=> 重息壤气
  # 灼铜
  灼铜生产: 2气态赫铜 + 息壤气 =>[气体反应炉+酸气环境]=> 气态灼铜
  灼铜凝华: 气态灼铜 =>[固气转化机]=> 灼铜块
  灼铜升华: 灼铜块 =>[固气转化机]=> 气态灼铜
  灼铜零件生产: 5灼铜块 =>[配件机+10s]=> 灼铜零件
  灼铜装备原件生产: 灼铜零件 + 2重息壤 =>[装备原件机+10s]=> 灼铜装备原件

类别:
  矿物: [惰气, 息壤气]
  流体: [惰气, 息壤气, 酸气] #, 水蒸气] 还没在机器配方里用到
  机器: [固气转化机, 液气转化机, 气体反应炉, 气体散步机] # 没有使用气体散布机的配方，所以可以叫它散步机
  环境: [惰气, 息壤, 酸气]

