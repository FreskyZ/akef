# v1.2 2026-04-17 赫铜，重息壤科技，息壤葫芦

配方:
  赤铜溶解: 赤铜粉末 + 沉积酸 =>[反应池]=> 赤铜溶液
  赤铜溶解-扩容: 赤铜粉末 + 沉积酸 =>[扩容反应池]=> 赤铜溶液
  赫铜提纯: 4赤铜溶液 =>[提纯机]=> 沉积酸 + 赫铜溶液
  # 铁置换铜太科学了，结果被固气转化机和液气转化机偷了桃子
  赫铜沉淀: 2赫铜溶液 + 蓝铁粉末 =>[反应池]=> 污水 + 赫铜块
  赫铜沉淀-扩容: 2赫铜溶液 + 蓝铁粉末 =>[扩容反应池]=> 污水 + 赫铜块
  赫铜瓶生产: 2赫铜块 =>[塑形机]=> 赫铜瓶
  赫铜零件生产: 5赫铜块 =>[配件机+10s]=> 赫铜零件
  # 蓝铁的要10个蓝铁，赤铜的要10个赤铜，息壤的要10个息壤（紫晶的要5个紫晶，但是高晶的要20个紫晶），
  # 但是赫铜的只要2个赫铜，因为这个版本里4个赤铜=1个赫铜，但是新版本里气体科技里1赤铜=1赫铜了这个可能很赚（
  赫铜装备原件生产: 2重息壤 + 2赫铜零件 =>[装备原件机+10s]=> 赫铜装备原件
  # 污水体系的扩容版本，和一个新的提纯功能
  污水再利用-扩容: 污水 + 液化息壤 =>[扩容反应池]=> 壤晶废液 + 惰性壤晶废液
  壤晶废液再利用-扩容: 2壤晶废液 + 蓝铁粉末 =>[扩容反应池]=> 壤晶 + 污水
  惰性壤晶废液提纯: 4惰性壤晶废液 =>[提纯机]=> 壤晶废液 + 清水
  # 然后用污水生产重息壤
  重息壤生产: 10息壤 + 10壤晶废液 =>[天有洪炉+10s]=> 重息壤
  # 妙妙解谜小道具
  息壤溶解-扩容: 息壤 + 清水 =>[扩容反应池]=> 液化息壤
  重息壤溶解: 重息壤 + 沉积酸 =>[反应池]=> 液化重息壤
  重息壤溶解-扩容: 重息壤 + 沉积酸 =>[扩容反应池]=> 液化重息壤
  # 药品生产线的扩容版本
  芽针溶液生产-扩容: 清水 + 芽针粉末 =>[扩容反应池]=> 芽针溶液
  锦草溶液生产-扩容: 清水 + 锦草粉末 =>[扩容反应池]=> 锦草溶液
  # 活动
  实验息壤瓶生产: 2息壤 =>[塑形机]=> 实验息壤瓶
  实验息壤零件生产: 息壤 =>[配件机]=> 实验息壤零件
  息壤葫芦生产: 5实验息壤瓶 + 5实验息壤零件 =>[封装机+10s]=> 息壤葫芦
  # 你知道吗，这个是1+5=1，但是这个是活动配方，以后有正式配方也这样了再支持
  # 实验重息壤瓶-芽针溶液生产: 实验重息壤瓶 + 5芽针溶液 =>[灌装机]=> 实验重息壤瓶-芽针溶液
  实验重息壤瓶生产: 重息壤 =>[塑形机+20s]=> 实验重息壤瓶
  实验重息壤零件生产: 重息壤 =>[配件机+20s]=> 实验重息壤零件
  实验玉铜发散器生产: 实验重息壤零件 + 赫铜块 =>[封装机+10s]=> 实验玉铜发散器
  息壤玉葫芦生产: 实验重息壤瓶-芽针溶液 + 实验玉铜发散器 =>[封装机+10s]=> 息壤玉葫芦

# 1机器葫芦：0.5/s瓶，0.5/s零件
# 0.5/s瓶：1机器：2带息壤
# 0.5/s零件：1机器：1带息壤
# 1机器重葫芦：0.1/s瓶装芽针溶液，0.1/s发散器
# 0.1/s瓶装芽针溶液：0.1/s重瓶，0.5/s/1带芽针溶液
# 0.1/s重瓶：2机器，0.1/s/0.2带重息壤
# 0.1/s发散器：1机器，0.1s/重零件，0.1/s/0.2带赫铜块
# 0.1/s重零件：2机器，0.1/s/0.2带重息壤

类别:
  瓶子: [实验息壤瓶, 实验重息壤瓶]
  机器: [扩容反应池, 提纯机]

