
配方:
  # 我的天哪砂叶大人（已经变成老大人了）
  # 以防你没发现研磨机是砂叶专机，砂叶老了之后再也没有新配方了
  砂叶粉碎: 砂叶 =>[粉碎机]=> 3砂叶粉末
  # 妙妙解谜小道具，注意到晶体外壳是最早的解谜小道具
  晶体外壳精炼: 源矿 =>[精炼炉]=> 晶体外壳
  # 把这些“什么叫做粉碎完还能精炼回去”的配方叫“重（chong）精炼”
  晶体外壳重精炼: 晶体外壳粉末 =>[精炼炉]=> 晶体外壳
  晶体外壳粉碎: 晶体外壳 =>[粉碎机]=> 晶体外壳粉末
  晶体外壳粉末精炼: 源石粉末 =>[精炼炉]=> 晶体外壳粉末
  酮化灌木粉碎: 酮化灌木 =>[粉碎机]=> 2酮化灌木粉末
  工业爆炸物生产: 5紫晶零件 + 酮化灌木粉末 =>[封装机+10s]=> 工业爆炸物
  # 紫晶科技
  紫晶精炼: 紫晶矿 =>[精炼炉]=> 紫晶纤维
  紫晶粉碎: 紫晶纤维 =>[粉碎机]=> 紫晶粉末
  紫晶重精炼: 紫晶粉末 =>[精炼炉]=> 紫晶纤维
  紫晶质瓶生产: 2紫晶纤维 =>[塑形机]=> 紫晶质瓶
  紫晶零件生产: 紫晶纤维 =>[配件机]=> 紫晶零件
  紫晶装备原件生产: 5晶体外壳 + 5紫晶纤维 =>[装备原件机+10s]=> 紫晶装备原件
  高晶研磨: 2紫晶粉末 + 砂叶粉末 =>[研磨机]=> 高晶粉末
  高晶粉碎: 高晶粉末 =>[精炼炉]=> 高晶纤维
  高晶质瓶生产: 2高晶纤维 =>[塑形机]=> 高晶质瓶
  高晶零件生产: 高晶纤维 =>[配件机]=> 高晶零件
  致密晶体研磨: 2晶体外壳粉末 + 砂叶粉末 =>[研磨机]=> 致密晶体粉末
  致密晶体精炼: 致密源石粉末 =>[精炼炉]=> 致密晶体粉末
  密制晶体精炼: 致密晶体粉末 =>[精炼炉]=> 密制晶体
  高晶装备原件生产: 10密制晶体 + 10高晶纤维 =>[装备原件机+10s]=> 高晶装备原件
  # 蓝铁科技
  蓝铁精炼: 蓝铁矿 =>[精炼炉]=> 蓝铁块
  蓝铁粉碎: 蓝铁块 =>[粉碎机]=> 蓝铁粉末
  蓝铁重精炼: 蓝铁粉末 =>[精炼炉]=> 蓝铁块
  蓝铁瓶生产: 2蓝铁块 =>[塑形机]=> 蓝铁瓶
  铁制零件生产: 蓝铁块 =>[配件机]=> 铁制零件
  蓝铁装备原件生产: 10晶体外壳 + 10蓝铁块 =>[装备原件机+10s]=> 蓝铁装备原件
  蓝铁研磨: 砂叶粉末 + 2蓝铁粉末 =>[研磨机]=> 致密蓝铁粉末
  钢材精炼: 致密蓝铁粉末 =>[精炼炉]=> 钢块
  钢质瓶生产: 2钢块 =>[塑形机]=> 钢质瓶
  钢制零件生产: 钢块 =>[配件机]=> 钢制零件
  # 电池，注意到电池是用各种材料包装的源石
  源石粉碎: 源矿 =>[粉碎机]=> 源石粉末
  致密源石研磨: 2源石粉末 + 砂叶粉末 =>[研磨机]=> 致密源石粉末
  低容谷地电池生产: 10源石粉末 + 5紫晶零件 =>[封装机+10s]=> 低容谷地电池
  中容谷地电池生产: 15源石粉末 + 10铁制零件 =>[封装机+10s]=> 中容谷地电池
  高容谷地电池生产: 15致密源石粉末 + 10钢制零件 =>[封装机+10s]=> 高容谷地电池
  # 我们罗德岛（划掉）终末地是药品公司
  # 灌装机所有有意义的配方都在这里了
  荞花粉碎: 荞花 =>[粉碎机]=> 2荞花粉末
  柑实粉碎: 柑实 =>[粉碎机]=> 2柑实粉末
  荞愈胶囊生产: 5紫晶质瓶 + 5荞花粉末 =>[灌装机+10s]=> 荞愈胶囊
  柑实罐头生产: 5紫晶质瓶 + 5柑实粉末 =>[灌装机+10s]=> 柑实罐头
  优质荞愈胶囊生产: 10荞花粉末 + 10蓝铁瓶 =>[灌装机+10s]=> 优质荞愈胶囊
  优质柑实罐头生产: 10柑实粉末 + 10蓝铁瓶 =>[灌装机+10s]=> 优质柑实罐头
  荞花精磨: 2荞花粉末 + 砂叶粉末 =>[研磨机]=> 细磨荞花粉末
  柑实精磨: 2柑实粉末 + 砂叶粉末 =>[研磨机]=> 细磨柑实粉末
  精选荞愈胶囊生产: 10细磨荞花粉末 + 10钢质瓶 =>[灌装机+10s]=> 精选荞愈胶囊
  精选柑实罐头生产: 10细磨柑实粉末 + 10钢质瓶 =>[灌装机+10s]=> 精选柑实罐头
  # 种植机要用碳块（要是没有这个的话我就把这些归到息壤产线里去了）
  原木烧炭: 原木 =>[精炼炉]=> 碳块
  荞花烧炭: 荞花 =>[精炼炉]=> 碳块
  柑实烧炭: 柑实 =>[精炼炉]=> 碳块
  砂叶烧炭: 砂叶 =>[精炼炉]=> 碳块
  碳块粉碎: 碳块 =>[粉碎机]=> 2碳粉末
  # 我问你都变成粉末了怎么不完全燃烧变成木炭
  荞花粉末碳化: 荞花粉末 =>[精炼炉]=> 碳粉末
  柑实粉末碳化: 柑实粉末 =>[精炼炉]=> 碳粉末
  砂叶粉末碳化: 3砂叶粉末 =>[精炼炉]=> 2碳粉末
  # 武陵
  # 息壤
  芽针烧炭: 芽针 =>[精炼炉]=> 2碳块
  锦草烧炭: 锦草 =>[精炼炉]=> 2碳块
  芽针粉末碳化: 芽针粉末 =>[精炼炉]=> 2碳粉末
  锦草粉末碳化: 锦草粉末 =>[精炼炉]=> 2碳粉末
  碳粉末研磨: 2碳粉末 + 砂叶粉末 =>[研磨机]=> 致密碳粉末
  # 我问你精磨/致密的粉末是怎么不完全燃烧变成木炭的
  细磨荞花粉末碳化: 细磨荞花粉末 =>[精炼炉]=> 致密碳粉末
  细磨柑实粉末碳化: 细磨柑实粉末 =>[精炼炉]=> 致密碳粉末
  稳定碳块研磨: 致密碳粉末 =>[精炼炉]=> 稳定碳块
  息壤生产: 清水 + 2稳定碳块 =>[天有洪炉]=> 息壤
  息壤装备原件生产: 10密制晶体 + 10息壤 =>[装备原件机+10s]=> 息壤装备原件
  低容武陵电池生产: 5息壤 + 15致密源石粉末 =>[封装机+10s]=> 低容武陵电池
  # 药品
  芽针粉碎: 芽针 =>[粉碎机]=> 2芽针粉末
  锦草粉碎: 锦草 =>[粉碎机]=> 2锦草粉末
  芽针溶解: 清水 + 芽针粉末 =>[反应池]=> 芽针溶液
  锦草溶解: 清水 + 锦草粉末 =>[反应池]=> 锦草溶液
  芽针针剂生产: 5蓝铁瓶-芽针溶液 + 10铁制零件 =>[封装机+10s]=> 芽针针剂
  锦草软饮生产: 5蓝铁瓶-锦草溶液 + 10铁制零件 =>[封装机+10s]=> 锦草软饮
  # 妙妙解谜小道具，种地小道具
  息壤溶解: 息壤 + 清水 =>[反应池]=> 液化息壤
  膨地啪生产: 液化息壤 + 驮兽粪便 =>[天有洪炉]=> 膨地啪

类别:
  植物: [柑实, 砂叶, 芽针, 荞花, 锦草, 酮化灌木]
  矿物: [源矿, 紫晶矿, 蓝铁矿, 清水, 原木, 驮兽粪便]
  瓶子: [紫晶质瓶, 高晶质瓶, 蓝铁瓶, 钢质瓶]
  流体: [液化息壤, 清水, 芽针溶液, 锦草溶液]
  # 注意到拆解机这里就有了但是没有任何有意义的配方
  机器: [精炼炉, 粉碎机, 灌装机, 封装机, 装备原件机, 采种机, 种植机, 配件机, 塑形机, 研磨机, 反应池, 天有洪炉]

