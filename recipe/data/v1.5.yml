# v1.5 2026-09-02 没别的更新，息壤龙泡泡

配方:
  实验息壤块生产: 息壤 =>[精炼炉]=> 实验息壤块
  # 塑形机别的配方都是瓶，所以龙泡泡外壳=瓶
  实验龙泡泡外壳生产: 实验息壤块 =>[塑形机]=> 实验龙泡泡外壳
  实验铜骨骼生产: 4赤铜零件 + 息壤 =>[封装机]=> 实验铜骨骼
  息壤龙泡泡生产: 5实验龙泡泡外壳 + 5实验铜骨骼 =>[封装机+10s]=> 息壤龙泡泡
  实验重息壤块生产: 重息壤 =>[精炼炉+10s]=> 实验重息壤块
  实验龙泡泡重壳生产: 实验重息壤块 + 5惰气 =>[塑形机+10s]=> 实验龙泡泡重壳
  实验息壤铜气生产: 2气态赤铜 + 息壤气 =>[气体反应炉+惰气环境]=> 实验息壤铜气
  实验息壤铜锭生产: 实验息壤铜气 =>[固气转化机]=> 实验息壤铜锭
  实验息壤铜零件生产: 5实验息壤铜锭 =>[配件机+10s]=> 实验息壤铜零件
  实验息壤铜骨骼生产: 实验息壤铜零件 + 重息壤 =>[封装机+10s]=> 实验息壤铜骨骼
  重息壤龙泡泡生产: 实验龙泡泡重壳 + 实验息壤铜骨骼 =>[封装机+10s]=> 重息壤龙泡泡

