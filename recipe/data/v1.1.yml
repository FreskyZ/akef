# v1.1 2026-03-12 赤铜科技

配方:
  赤铜冶炼: 清水 + 赤铜矿 =>[精炼炉]=> 赤铜块 + 污水
  赤铜粉碎: 赤铜块 =>[粉碎机]=> 赤铜粉末 # 以防你没发现这是最后一个粉碎机配方？
  赤铜瓶生产: 2赤铜块 =>[塑形机]=> 赤铜瓶
  赤铜零件生产: 赤铜块 =>[配件机]=> 赤铜零件
  赤铜装备原件生产: 10息壤 + 10赤铜零件 =>[装备原件机+10s]=> 赤铜装备原件
  # 污水和用污水生产的中容电池
  污水无害化处理: 污水 =>[废水处理机]=> 无
  污水再利用: 污水 + 液化息壤 =>[反应池]=> 壤晶废液 + 惰性壤晶废液
  壤晶废液无害化处理: 壤晶废液 =>[废水处理机]=> 无
  惰性壤晶废液无害化处理: 惰性壤晶废液 =>[废水处理机]=> 无
  壤晶废液再利用: 2壤晶废液 + 蓝铁粉末 =>[反应池]=> 壤晶 + 污水
  中容武陵电池生产: 5壤晶 + 20致密源石粉末 =>[封装机+10s]=> 中容武陵电池
  # 药品，你往针剂和饮料里塞10个零件干什么
  优质芽针针剂生产: 5赤铜瓶-芽针溶液 + 10赤铜零件 =>[封装机+10s]=> 优质芽针针剂
  优质锦草软饮生产: 5赤铜瓶-锦草溶液 + 10赤铜零件 =>[封装机+10s]=> 优质锦草软饮

类别:
  矿物: [赤铜矿]
  瓶子: [赤铜瓶]
  流体: [污水, 壤晶废液, 惰性壤晶废液]
  机器: [废水处理机]

